<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000">
<defs>
 <linearGradient id="wall" x1="0" y1="0" y2="1"><stop stop-color="#eff5f8"/><stop offset="1" stop-color="#dce7ec"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" y2="1"><stop stop-color="#bdc8cb"/><stop offset="1" stop-color="#8b9b9f"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" y2="1"><stop stop-color="#a5cee0"/><stop offset="1" stop-color="#d8eaf0"/></linearGradient>
 <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dde6e8"/><stop offset="1" stop-color="#a8b8c0"/></linearGradient>
 <linearGradient id="dark" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#2b4c61"/><stop offset="1" stop-color="#0b2436"/></linearGradient>
 <pattern id="floorlines" width="140" height="70" patternUnits="userSpaceOnUse"><path d="M 0 0 L 140 0 M 0 0 L 0 70" fill="none" stroke="#f1f5f6" opacity=".19" stroke-width="2"/></pattern>
 <filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<!-- Panoramic continuous illustration, deliberately fictional demonstration room -->
<rect width="2000" height="680" fill="url(#wall)"/><path d="M0 0 H2000 V125 H0Z" fill="#f7fafb"/>
